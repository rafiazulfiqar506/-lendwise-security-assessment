
# LendWise Microfinance - Isolated Security Testing Lab
#
# This spins up a stand-in "staging copy" of the LendWise loan platform
# (OWASP Juice Shop, a deliberately vulnerable web app widely used for
# security training) plus a reverse proxy so it's reachable at
# https://staging.lendwise.test — exactly like a real staging environment.
#
# Everything runs on an internal Docker network with NO route to the
# real internet or any production system. This is the "fully isolated
# lab environment" the task requires.

services:

  # --- The "LendWise platform" stand-in ---
  # In a real engagement this would be the actual staging build of
  # LendWise's web portal. Here we use Juice Shop as a safe, legal,
  # deliberately-vulnerable practice target with the same class of
  # bugs (broken auth, IDOR, injection, etc.) you're expected to find.
  lendwise-app:
    image: bkimminich/juice-shop:latest
    container_name: lendwise-app
    restart: unless-stopped
    networks:
      - lab-internal     # ONLY on the internal net — no internet, ever
    expose:
      - "3000"
    volumes:
      - app-data:/app/data   # so we can snapshot/restore app state

  # --- Reverse proxy: makes the app reachable at staging.lendwise.test ---
  # This is the ONLY container with a foot in both networks, so it can
  # forward your browser traffic in without giving the app itself any
  # route out.
  lendwise-proxy:
    image: nginx:alpine
    container_name: lendwise-proxy
    restart: unless-stopped
    depends_on:
      - lendwise-app
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx   # access.log & error.log land here for Task 2 analysis
    networks:
      - lab-internal
      - lab-edge

networks:
  # internal: true means Docker gives this network NO route out to the
  # host's real internet connection — this is the "network isolation"
  # the task asks for. The app container lives ONLY here.
  lab-internal:
    driver: bridge
    internal: true
  # lab-edge is a normal network that only exists so YOU (via your
  # browser, on the host) can reach the proxy. The app never touches it.
  lab-edge:
    driver: bridge

volumes:
  app-data:

# Reverse proxy so the lab answers at https://staging.lendwise.test
# instead of a raw localhost:port — matching what a real staging
# environment would look like.
#
# HARDENED (Task 3): server tokens hidden, security headers added,
# TLS restricted to modern protocols only.

server {
    listen 80;
    server_name staging.lendwise.test;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.lendwise.test;

    # --- Hardening: hide version info ---
    server_tokens off;

    # --- Hardening: modern TLS only ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ssl_certificate     /etc/nginx/certs/lendwise-test.crt;
    ssl_certificate_key /etc/nginx/certs/lendwise-test.key;

    # --- Hardening: security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    location / {
        proxy_pass http://lendwise-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

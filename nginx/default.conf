# Reverse proxy so the lab answers at https://staging.lendwise.test
# instead of a raw localhost:port — matching what a real staging
# environment would look like.

server {
    listen 80;
    server_name staging.lendwise.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.lendwise.test;

    ssl_certificate     /etc/nginx/certs/lendwise-test.crt;
    ssl_certificate_key /etc/nginx/certs/lendwise-test.key;

    location / {
        proxy_pass http://lendwise-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
